name: Controlled model provider E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Pre-production backend and frontend base URL
        required: true
        type: string
      model_provider:
        description: Provider identifier configured in the isolated backend
        required: true
        type: string
      model_name:
        description: Billable model identifier configured in the isolated backend
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-e2e-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  provider-e2e:
    name: Real provider generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-e2e
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
      E2E_MODEL_PROVIDER: ${{ inputs.model_provider }}
      E2E_MODEL_NAME: ${{ inputs.model_name }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Validate controlled test configuration
        shell: bash
        run: |
          test -n "$PLAYWRIGHT_BASE_URL" || { echo 'base_url is required'; exit 1; }
          test -n "$E2E_MODEL_PROVIDER" || { echo 'model provider is required'; exit 1; }
          test -n "$E2E_MODEL_NAME" || { echo 'model name is required'; exit 1; }
          test -n "$E2E_USERNAME" || { echo 'provider-e2e.E2E_USERNAME is required'; exit 1; }
          test -n "$E2E_PASSWORD" || { echo 'provider-e2e.E2E_PASSWORD is required'; exit 1; }

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run billable provider journey
        run: pnpm exec playwright test model-provider --project=desktop-chromium
