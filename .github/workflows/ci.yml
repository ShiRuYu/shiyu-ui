name: Frontend quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  quality:
    name: Typecheck, unit test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node

      - name: Typecheck web-naive
        run: pnpm -F @vben/web-naive run typecheck

      - name: Run application contract tests
        run: pnpm exec vitest run apps/web-naive/src

      - name: Build web-naive
        run: pnpm -F @vben/web-naive run build
