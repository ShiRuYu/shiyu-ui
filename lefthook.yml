pre-commit:
  parallel: false
  commands:
    code-workspace:
      run: pnpm vsh code-workspace --auto-commit
      skip:
        - merge
        - rebase
    lint-md:
      run: pnpm oxfmt {staged_files}
      glob: '*.md'
      skip:
        - merge
        - rebase
    lint-vue:
      run: pnpm exec oxfmt {staged_files} && pnpm exec eslint --cache --fix {staged_files}
      glob: '*.vue'
      skip:
        - merge
        - rebase
    lint-js:
      run: pnpm exec oxfmt {staged_files} && pnpm exec eslint --cache --fix {staged_files}
      glob: '*.{js,jsx,ts,tsx}'
      skip:
        - merge
        - rebase
    lint-style:
      run: pnpm exec oxfmt {staged_files}
      glob: '*.{scss,less,styl,html,vue,css}'
      skip:
        - merge
        - rebase
    lint-package:
      run: pnpm exec oxfmt {staged_files}
      glob: 'package.json'
      skip:
        - merge
        - rebase
    lint-json:
      run: pnpm exec oxfmt {staged_files}
      glob: '{!(package)*.json,*.code-snippets,.!(browserslist)*rc}'
      skip:
        - merge
        - rebase

post-merge:
  commands:
    install:
      run: pnpm install

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit $1
